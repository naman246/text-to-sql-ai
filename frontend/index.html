<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Text-to-SQL AI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 900px;

            background: white;

            border-radius: 15px;

            padding: 30px;

            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .chat {
            min-height: 350px;
            max-height: 450px;

            overflow-y: auto;

            border: 1px solid #ddd;

            border-radius: 10px;

            padding: 20px;

            margin-bottom: 20px;
        }

        .message {
            margin-bottom: 15px;

            padding: 12px 15px;

            border-radius: 10px;

            line-height: 1.5;
        }

        .user {
            background: #e8f0fe;
        }

        .ai {
            background: #f1f3f4;
        }

        .input-area {
            display: flex;

            gap: 10px;
        }

        input {
            flex: 1;

            padding: 14px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;
        }

        button {
            padding: 14px 25px;

            border: none;

            border-radius: 8px;

            background: #222;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        #clearButton {
            background: #777;
        }

        #clearButton:hover {
            background: #555;
        }

        button:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }

        pre {
            margin-top: 10px;

            padding: 12px;

            background: #222;

            color: white;

            border-radius: 8px;

            overflow-x: auto;

            white-space: pre-wrap;
        }

    </style>

</head>


<body>

    <div class="container">

        <h1> Text-to-SQL AI</h1>

        <p class="subtitle">
            Ask questions about your database using natural language
        </p>


        <div class="chat" id="chat">

            <div class="message ai">
                 Hi! Ask me anything about the database.
            </div>

        </div>


        <div class="input-area">

            <input
        type="text"
        id="question"
        placeholder="Example: Who spent the most money?"
    >

    <button id="askButton">
        Ask
    </button>

    <button id="clearButton">
        Clear
    </button>

        </div>

    </div>


    <script>

        let pendingQuestion = null;


        function addMessage(type, text) {

            const chat = document.getElementById("chat");

            const message = document.createElement("div");

            message.className = "message " + type;

            const label = type === "user" ? "You:" : "AI:";

            const formattedText = String(text).replace(
                /\*\*(.*?)\*\*/g,
                "<strong>$1</strong>"
            );

            message.innerHTML =
                "<strong>" +
                label +
                "</strong> " +
                formattedText;

            chat.appendChild(message);

            chat.scrollTop = chat.scrollHeight;
        }


        async function askQuestion() {

            console.log("Ask button clicked!");

            const input = document.getElementById("question");

            const button = document.getElementById("askButton");

            const userMessage = input.value.trim();


            if (!userMessage) {

                console.log("Question is empty.");

                return;
            }


            addMessage("user", userMessage);

            input.value = "";

            button.disabled = true;

            button.innerText = "Thinking...";


            let questionToSend = userMessage;


            if (pendingQuestion) {

                questionToSend =
                    pendingQuestion +
                    "\n\nUser clarification: " +
                    userMessage;

                pendingQuestion = null;
            }


            console.log("Sending question:", questionToSend);


            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/ask",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            question: questionToSend
                        })
                    }
                );


                console.log(
                    "HTTP status:",
                    response.status
                );


                const data = await response.json();


                console.log(
                    "Server response:",
                    data
                );


                if (
                    data.status ===
                    "clarification_needed"
                ) {

                    pendingQuestion =
                        questionToSend;

                    addMessage(
                        "ai",
                        "🤔 " +
                        data.question
                    );

                }


                else if (
                    data.status ===
                    "success"
                ) {

                    addMessage(
                        "ai",
                        data.answer
                    )
                    ;


                    const chat =
    document.getElementById("chat");

const resultMessage =
    document.createElement("div");

resultMessage.className =
    "message ai";

let tableHTML = `
    <details>
        <summary>📊 View database results</summary>

        <table style="
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
        ">
            <thead>
                <tr>
`;

data.result.columns.forEach(function(column) {

    tableHTML += `
        <th style="
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        ">
            ${column}
        </th>
    `;

});

tableHTML += `
                </tr>
            </thead>

            <tbody>
`;

data.result.rows.forEach(function(row) {

    tableHTML += "<tr>";

    row.forEach(function(value) {

        tableHTML += `
            <td style="
                border: 1px solid #ccc;
                padding: 10px;
            ">
                ${value}
            </td>
        `;

    });

    tableHTML += "</tr>";

});

tableHTML += `
            </tbody>
        </table>

    </details>
`;

resultMessage.innerHTML = tableHTML;

chat.appendChild(resultMessage);

chat.scrollTop = chat.scrollHeight;


                    const sqlMessage =
                        document.createElement(
                            "div"
                        );


                    sqlMessage.className =
                        "message ai";


                    sqlMessage.innerHTML = `
                        <details>
                            <summary>
                                🔍 View generated SQL
                            </summary>

                            <pre>${data.sql}</pre>

                        </details>
                    `;


                    chat.appendChild(
                        sqlMessage
                    );


                    chat.scrollTop =
                        chat.scrollHeight;

                }


                else {

                    addMessage(
                        "ai",
                        "❌ " +
                        (
                            data.error ||
                            "Something went wrong."
                        )
                    );

                }

            }


            catch (error) {

                console.error(
                    "Request failed:",
                    error
                );

                addMessage(
                    "ai",
                    "❌ Could not connect to the server."
                );

            }


            button.disabled = false;

            button.innerText = "Ask";
        }


        document
            .getElementById("askButton")
            .addEventListener(
                "click",
                askQuestion
            );


        document
            .getElementById("question")
            .addEventListener(
                "keydown",
                function(event) {

                    if (event.key === "Enter") {

                        askQuestion();

                    }

                }
            );


        console.log(
            "Text-to-SQL frontend loaded successfully!"
        );

        document
    .getElementById("clearButton")
    .addEventListener(
        "click",
        function() {

            document.getElementById("chat").innerHTML = `
                <div class="message ai">
                    👋 Hi! Ask me anything about the database.
                </div>
            `;

            pendingQuestion = null;

        }
    );

    </script>

</body>

</html>
